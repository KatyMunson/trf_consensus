# =============================================================================
# config.yaml — TRF motif consensus-of-consensus pipeline
#
# Fully programmatic: scans the whole .dat file for candidate period bins,
# no manually-curated periods.tsv. See Snakefile header for the full flow.
# =============================================================================

# Manifest of entries to run the pipeline over. One row per individual x
# assembly-method combination ("entry"), tab-separated, columns: entry_id,
# individual, assembly_method, phasing_status (phased_pooled|unphased),
# fasta_paths, trf_dat_paths. phased_pooled entries give two ;-separated
# haplotype paths (pooled at calling time); unphased entries give one. Only
# trf_dat_paths is actually read by the pipeline -- fasta_paths is
# provenance/documentation only. See config/manifest.example.tsv for a
# worked example and the README's "Manifest" section for the full schema.
manifest: "config/manifest.tsv"

# Flat top-level key (not nested under satellite_screen:) so it can be overridden
# from the command line without editing this file: --config satellite_screen_manifest=path.
# Optional -- same manifest.tsv schema as `manifest:` above. Defaults to the main
# manifest if unset/not overridden. Read only by satellite_screen/Snakefile (a
# separate Snakefile, not part of this pipeline's normal run -- see its own header
# comment and the README's "Genome-wide satellite screening" section). Use this to
# evaluate a new assembly against the CURRENT repeatmasker_custom_lib.fasta without
# touching the main pipeline or manifest.
# satellite_screen_manifest: "config/supplemental_manifest.tsv"

# Source contig/scaffold name to label entries with when a .dat file has no
# header lines at all (neither "Sequence: <name>" nor "@<name>" -ngs style).
# Leave "" if your .dat files have real headers. This is a single global
# fallback applied uniformly to every manifest entry, not configurable per
# entry.
trf_dat_default_seqname: ""

# RepeatMasker library classification suffix, e.g. "Satellite" or
# "Satellite/centromeric" — EDIT this to match how you want these classified
# before loading into RepeatMasker / FamDB. Redundant/demoted clusters get
# "/redundant_with_<label>" appended automatically.
repeatmasker_classification: "Satellite"

# --- Step 1: candidate period bin scanning ---
# Nominates period sizes worth pulling loci for. A bin passes if EITHER:
#   distributed: >=min_blocks total loci within period+/-window, AND >=1 with
#     copy_number >= min_copy_number
#   single massive block: ANY one locus with copy_number >= min_single_block_copy_number,
#     regardless of block count (catches a large array TRF captured as one locus)
candidate_scan:
  min_copy_number: 100
  min_blocks: 5
  min_single_block_copy_number: 300
  min_period_length: 150 # HUMAN-CENTRIC DEFAULT, RECONSIDER PER SPECIES: 150 was picked to sit
                          # just below human alpha-satellite (171bp) and exclude micro/mini-
                          # satellites. It will categorically exclude any real, well-characterized
                          # satellite family shorter than 150bp — some centromeric/pericentromeric
                          # satellites in other taxa run well under this. If working with a
                          # non-human genome, or if you're unsure what satellite periods to expect,
                          # lower this for a permissive discovery pass and use total_array_bp /
                          # mean_percent_match / mean_entropy in candidate_periods_raw.tsv to
                          # triage the results rather than relying on this filter alone.
  window: 5              # +/- tolerance for both block-counting and extraction
  nms_radius: 5           # suppression radius so nearby period values don't get
                          # reported as separate candidates (see scan_dat_candidates.py)

# --- Genome-wide -lib screening + TRF coverage evaluation ---
# Not part of the automatic pipeline -- its own Snakefile, satellite_screen/Snakefile,
# run via `snakemake -s satellite_screen/Snakefile ... satellite_screen`. See that
# file's header comment and the README's "Genome-wide satellite screening" section.
satellite_screen:
  # Gap tolerance (bp) for merging nearby passing TRF loci into one region.
  merge_distance: 2000
  # Fraction of a likely-satellite region's length that must be overlapped
  # by a -lib hit to count as "covered" in the histogram/missing list. The
  # overall bp recall % in coverage_summary.tsv is unaffected by this --
  # it sums actual overlapping bp across all regions regardless.
  min_coverage_fraction: 0.5
  # Number of chunks run_repeatmasker_genome_lib is sharded into per sample
  # (snake/boustrophedon split by contig count, see workflow/scripts/split_fasta.py).
  # Don't set higher than your smallest sample's contig count, or later shards get
  # an empty chunk fasta. ~2 threads/shard (see resources.run_repeatmasker_genome_lib
  # below) keeps a similar aggregate core footprint to the old unsharded 8-thread
  # invocation while giving SGE 6 smaller, more schedulable jobs instead of 1 big
  # one -- tune both to your cluster's actual spare job-slot capacity.
  repeatmasker_num_shards: 6

# --- Step 2: iterative cluster ranking (per bin) ---
# Repeatedly peels off the largest coherent sequence cluster from a bin,
# ranks all discovered clusters by size. O(rounds x N), not O(N^2) all-vs-all.
cluster_ranking:
  min_cluster_size: 3    # stop peeling once the remainder (or a new cluster) is smaller than this
  max_rounds: 15          # safety cap on peeling rounds per bin
  min_cluster_identity: 0.80  # edlib anchor-match identity required to join a cluster
  max_gap_fraction: 0.5        # alignment columns with >= this gap fraction are dropped from the consensus

# --- Step 3: cross-cluster redundancy resolution ---
# Same rotation/strand-aware edlib comparison as before, now run across every
# cluster found in every bin (including different ranks within the same bin).
# Flagged pairs are grouped (transitively) and the cluster with the most
# support (highest n_input_sequences) in each group wins; others are kept in
# the output but marked redundant.
cross_cluster_comparison:
  min_identity: 0.70        # per-copy identity required when tiling the shorter sequence against the longer
  min_coverage: 0.85         # fraction of the longer sequence's length that must be explained by tiled copies
  max_copies: 6               # largest number of tiled copies to search for per pair
  n_shuffles: 20                # mononucleotide-shuffled null trials per candidate-passing pair. Dropping
                                 # this to ~8-10 roughly halves the null-test stage's cost, with
                                 # max_null_passes still at 0 preserving a real (if slightly less powerful)
                                 # significance test -- worth considering if runtime is still an issue after
                                 # sharding (num_shards below).
  max_null_passes: 0           # a pair is only confirmed if at most this many shuffled trials also pass
                                # min_coverage (default 0 = ALL shuffles must fail to confirm real signal)
  num_shards: 4                 # split the pairwise comparison across this many parallel Snakemake jobs
                                 # (cross_cluster_comparison rule), rejoined by
                                 # concatenate_cross_cluster_comparison into the same output filename. Raise
                                 # for a larger pooled-cluster count / more available SGE slots; set to 1 to
                                 # run as a single job (identical output either way).
  null_test_skip_margin: 0.0  # 0.0 = off (current behavior, all candidate pairs null-tested). To trade
                               # some accuracy for speed once validated on your own data (rerun once with
                               # margin=0 and compare n_flagged in the log before trusting a nonzero value):
                               #   0.05 (moderate) - skips the shuffle test for pairs clearing
                               #     coverage>=0.90 and identity>=0.75 (min_coverage/min_identity + 0.05);
                               #     null-tests anything more marginal.
                               #   0.10 (conservative) - requires coverage>=0.95 and identity>=0.80 to
                               #     skip; fewer pairs qualify, less speedup, safer.

# --- Stage 3: per-entry cluster filter + cross-entry pooling ---
# Applied per entry, before pooling: a cluster's summed TRF copy number
# across its raw loci must meet this to survive into cross-entry comparison.
# results/copy_number_diagnostic.png (Stage 2b) plots every entry's
# pre-filter total_copy_number distribution with this threshold marked, to
# sanity-check it sits in a real gap between noise and signal.
copy_number_filter:
  min_total_copy_number: 500

# --- Stage 6: family ranking visualizations ---
visualization:
  top_n_families: 20  # bars drawn per individual and in the global ranking plot

# --- Step 4: known-repeat screening (results/known_repeat_hits.tsv) ---
# Runs RepeatMasker with -species against our OWN discovered consensus
# motifs (not the assembly) to check whether any match a previously
# characterized repeat family in Dfam/RepBase. Much cheaper and more
# targeted than screening the whole assembly: ~100-250 short sequences,
# well under a minute of actual RepeatMasker runtime regardless of library
# size.
known_repeat_screen:
  species: "zebra finch"  # RepeatMasker -species value. Per FamDB's own docs, specifying a
                      # species pulls its ENTIRE ancestor lineage automatically (Aves,
                      # Neognathae, etc. all inherited) PLUS any species-specific
                      # curated/de novo content filed at that node specifically —
                      # specificity is additive here, not narrowing, so there's no downside
                      # to using the most specific available relative rather than a broad
                      # clade name. Before committing, check what's actually populated with:
                      #   famdb.py -i <path-to-famdb> lineage -a "zebra finch"
                      # (verify the exact flag against your installed famdb.py --help first —
                      # this has changed across FamDB versions; see README's "Known-repeat
                      # screening" section). Shows family counts at each taxonomic level in the
                      # lineage — if zero are lineage-specific to zebra finch, querying "aves"
                      # would be equivalent).
  double_sequences: true  # concatenate each consensus to itself before screening, so a
                           # database entry starting at a different rotation phase can still
                           # align end-to-end against a contiguous stretch of the query. Same
                           # trick used internally elsewhere in this pipeline (see
                           # cross_motif_comparison.py).

