name: trf_consensus_repeatmasker
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Exact-pinned, deliberately NOT the latest release (4.2.4 as of writing)
  # and NOT a floor pin like mafft>=7.487 elsewhere in this repo. bioconda's
  # repeatmasker>=4.2.4 recipe gets its Dfam/FamDB library from a separate
  # `famdb` conda package that ships famdb.py but NO actual *.h5 data at
  # all (confirmed by reading bioconda-recipes' recipes/famdb/build.sh) —
  # so -species mode never works out of the box on that version chain,
  # regardless of network access, and needs a manual per-env
  # download-and-configure step every time. repeatmasker=4.1.5 (matching
  # vollgerlab/Rhodonite's pin, already proven working on this cluster) has
  # a working post-link.sh that downloads the real Dfam library over the
  # network at conda-install time, same as it does for Rhodonite's own env
  # — so this pin trades "always latest" for "actually works without a
  # manual FamDB setup step." Revisit if a future repeatmasker release
  # restores automatic FamDB provisioning.
  - repeatmasker=4.1.5
